# Miles-value table. CPM = value per 1,000 miles/points, in `moeda` (default: the program's currency in
# config/programas.yaml). Every search converts these values into the search currency automatically.
# atualizado_em is required. When older than 15 days, the agent warns and suggests /farehunter:miles.
#
# cpm_compra_atual: what BUYING miles costs today (current promotion or full price). Empty = can't buy / unknown.
# cpm_valor_uso:    what 1,000 miles you ALREADY HAVE are worth (opportunity cost). If empty, cpm_compra_atual is used.
# compra_minima / compra_passo: minimum purchase and purchase step in the program.
#
# Initial values from the 2026-10-02 research (docs/research.md §6 for Brazil, §10 international). Sources:
#   MD    = melhoresdestinos.com.br/milhas/valor-milheiro-azul-latam-smiles-2026 (target value, 2026-07-30)
#   MBot  = milhasbot.com.br/valores-do-milheiro/ (use value and buy ceiling, 2026-10-02)
#   PdP   = passageirodeprimeira.com (promotions)
#   VAL   = median of TPG (2026-10-01), Upgraded Points (2026-09-17), Frequent Miler (2026-09-02), NerdWallet (2026-10-02)
#   UPT   = upgradedpoints.com/news/current-point-purchase-promotions/ (2026-10-01)
#   GATE  = thegatewithbriancohen.com/miles-and-points-on-sale-october-2-2026/ (2026-10-02)
#   OMAAT = onemileatatime.com/deals/... ; AW = awardwallet.com/... (dates per line)
# International buy prices are the typical recurring promotional price (promotions come back every few weeks);
# the line says when a promotion has a fixed end date.

programas:
  # --- Brazil (BRL) ---
  smiles:
    cpm_compra_atual: 16.50   # no active promo on 2026-10-02; 16.50 is the recurring "good" ceiling (380% Club bonus came to 16.67 until 09-20)
    cpm_valor_uso: 22.0       # MBot, average use value
    compra_minima: 1000
    compra_passo: 1000
    fonte: "MD alvo 16 (30/07); MBot teto 14–16,50 e uso 22 (02/10); sem promoção de compra ativa em 02/10"
    atualizado_em: "2026-10-02"
  latam_pass:
    cpm_compra_atual: 24.50   # purchase at 65% off, valid until 2026-10-02 (PdP 09-29)
    cpm_valor_uso: 28.0
    compra_minima: 1000
    compra_passo: 1000
    fonte: "PdP 29/09 (65% OFF até 02/10); MD alvo 26; MBot uso 28"
    atualizado_em: "2026-10-02"
  azul:
    cpm_compra_atual: 21.0    # direct purchase at 70% off; via a bonus transfer it comes to ~R$ 10–13 (see transferencias)
    cpm_valor_uso: 17.0
    compra_minima: 1000
    compra_passo: 1000
    fonte: "MD alvo 13 (via clube/transferência); compra direta 70% OFF ~R$ 21; MBot uso 17 (02/10)"
    atualizado_em: "2026-10-02"

  # --- International (USD per 1,000) ---
  united:         {cpm_compra_atual: 18.8, cpm_valor_uso: 12.0,  moeda: USD, fonte: "VAL 1.2¢; buy 100% bonus = 1.88¢ (OMAAT 2026-07-15)", atualizado_em: "2026-10-02"}
  american:       {cpm_compra_atual: 22.6, cpm_valor_uso: 14.25, moeda: USD, fonte: "VAL 1.425¢; buy 40% off = 2.26¢ until 2026-10-31 (UPT, GATE)", atualizado_em: "2026-10-02"}
  delta:          {cpm_compra_atual: 25.1, cpm_valor_uso: 12.0,  moeda: USD, fonte: "VAL 1.2¢; buy 50% bonus = 2.51¢ (AW, date uncertain)", atualizado_em: "2026-10-02"}
  alaska:         {cpm_compra_atual: 15.9, cpm_valor_uso: 15.25, moeda: USD, fonte: "VAL 1.525¢; buy 120% bonus = 1.59¢ until 2026-10-19 (GATE)", atualizado_em: "2026-10-02"}
  aeroplan:       {cpm_compra_atual: 18.5, cpm_valor_uso: 14.5,  moeda: USD, fonte: "VAL 1.45¢; buy 30% off ≈ 1.85 USD¢ until 2026-10-13 (UPT); past 100% bonus = 1.35¢", atualizado_em: "2026-10-02"}
