# Program registry: the engine only knows what is listed here. Shipped with the plugin (not user data).
#
# milhas.<id>:  airline loyalty program
#   nome     display name
#   cias     IATA codes of the program's own airlines (to match an award with a cash fare)
#   seats    Seats.aero source id (null = not covered, e.g. LATAM Pass)
#   moeda    reference currency of this program's CPM values in milheiro.yaml
#   link     "smiles" | "latam_pass" | "azul" (deep link with route and date) or the award-search URL
#   compra   (optional) verified page to buy miles; without it the plan points to the program's site
# pontos.<id>:  transferable points currency (credit card / bank)
#   site     official site where transfers are made (log in → transfer points)
#   parceiros: {<miles program id>: {proporcao: points per mile, minimo: minimum points per transfer}}
#
# Sources (checked 2026-10-02, see docs/research.md §10): award-search URLs were fetched one by one; sites that
# block scripts (403/timeouts) only had their domain confirmed. Transfer ratios: TPG transfer-partner guide
# (2026-09-01), Citi→JAL (2026-09-21), Prince of Travel (CA), Head for Points (UK), Point Hacks (AU).
# Ratio "1000:800" (1,000 points → 800 miles) is stored as proporcao 1.25 points per mile.
#
# To add a program: add it here, put its CPM in config/milheiro.yaml and run `uv run pytest`.

