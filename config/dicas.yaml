# Timing tips knowledge base (shipped with the plugin; no Google calls). Research of 2026-10-02, ~45 sources;
# full table with every source in docs/research.md §11. Values are consensus ranges, not promises.

# Best booking window, in days before departure, by trip type. `cedo` = beyond this, fares are usually higher
# and promotions rare (waiting and watching usually pays); `tarde` = inside this, fares step up every week.
janelas:
  domestico_br: {melhor: [25, 60], alta_temporada: [60, 90], cedo: 150, tarde: 21,
                 fontes: "KAYAK Brasil 2026-04-16 (28-35d); Melhores Destinos (25-40d low, 60-90d high season); Decolar via Exame 2022 (30-60d)"}
  domestico:    {melhor: [21, 74], alta_temporada: [60, 150], cedo: 205, tarde: 21,
                 fontes: "CheapAir 2024 (21-74d, best 42; >205d +36%); Google Flights 2025 (best 39, 23-51); Going 2026 (1-3 months, 3-5 peak)"}
  regional:     {melhor: [30, 90], alta_temporada: [60, 150], cedo: 240, tarde: 21,
                 fontes: "Google Flights 2022/2025 (US→Mexico/Caribbean 37-87d); CheapAir 2025 (US→South America 70-100d); KAYAK Brasil 2026 (Brazil→LatAm 31-37d)"}
  longo:        {melhor: [60, 180], alta_temporada: [120, 300], cedo: 300, tarde: 30,
                 fontes: "CheapAir 2025 (Europe 120-160d, Asia 90-120d); Going 2026 (2-8 months, 4-10 peak); Hopper 2024 (Europe 3-6 mo); Melhores Destinos (30-60d low, 60-120d high from Brazil); Google 2025 (don't wait for drops on international)"}

# Flying day (not booking day) matters: Mon-Wed ~13% cheaper than weekends (Google Flights 2025-09-09);
# domestic Tue ~14% cheaper than Sun (Expedia 2026-02-17). Booking day effect is only 1-3%.
dia_da_semana: {baratos: [0, 1, 2], economia_pct: 13, fontes: "Google Flights 2025-09-09; Expedia 2026-02-17; CheapAir 2024"}

# Recurring sales by the user's country. `data`: MM-DD; `regra`: computed date. Expectations, not guarantees.
promocoes:
  BR:
    - {nome: "Aniversário GOL", data: "01-15", tipo: passagens, fonte: "Melhores Destinos 2026-01-21"}
    - {nome: "Semana do Consumidor", data: "03-15", tipo: passagens, fonte: "InfoMoney 2026-03-12 (LATAM Mega Promo, GOL, Azul)"}
    - {nome: "Aniversário Livelo", data: "06-15", tipo: pontos, fonte: "Passageiro de Primeira 2025-01-03"}
    - {nome: "Aniversário LATAM", data: "06-22", tipo: passagens, fonte: "Passageiro de Primeira 2025-01-03"}
    - {nome: "Aniversário Azul Fidelidade", data: "08-30", tipo: milhas, fonte: "Passageiro de Primeira 2025-01-03"}
    - {nome: "Dia do Cliente", data: "09-15", tipo: passagens_e_milhas, fonte: "Melhores Destinos 2025-09-15 (LATAM Pass awards that day)"}
    - {nome: "Aniversário Smiles", data: "10-18", tipo: milhas, fonte: "Passageiro de Primeira 2025-01-03"}
    - {nome: "Black Friday", regra: ultima_sexta_novembro, tipo: passagens_e_milhas, fonte: "Melhores Destinos 2024-11; Smiles Orange Friday up to 100% transfer bonus (Melhores Cartões 2025-11-28)"}
    - {nome: "Aniversário Azul", data: "12-15", tipo: passagens, fonte: "Melhores Destinos 2026-01-21"}
  US:
    - {nome: "January sales", data: "01-10", tipo: passagens, fonte: "NBC News"}
    - {nome: "Fall sales (after Labor Day)", data: "09-05", tipo: passagens, fonte: "TPG 2025 (Southwest fall sale)"}
    - {nome: "Black Friday / Cyber Monday / Travel Tuesday", regra: ultima_sexta_novembro, tipo: passagens, fonte: "TPG 2025"}
  GB:
    - {nome: "January sales (British Airways, easyJet, Ryanair)", data: "01-06", tipo: passagens, fonte: "British Airways 2026-01-06; travelwiseway 2025-12-24"}
  MX:
    - {nome: "Hot Sale", data: "05-26", tipo: passagens, fonte: "Crónica 2026-05-28 (Volaris up to 50%)"}
  AR:
    - {nome: "CyberMonday", data: "11-03", tipo: passagens, fonte: "Infobae 2025-11-03"}
  CL:
    - {nome: "CyberDay", data: "06-01", tipo: passagens, fonte: "Cooperativa 2026-05-22 (LATAM up to 67%)"}
    - {nome: "CyberMonday", data: "10-05", tipo: passagens, fonte: "cyberdaychile.com 2026-10-01"}
  CO:
    - {nome: "Black Friday", regra: ultima_sexta_novembro, tipo: passagens, fonte: "Infobae 2025-11-27"}

# High seasons by destination. `meses`: months (1-12) with higher fares; `faixas`: MM-DD..MM-DD ranges.
temporadas:
  brasil:          {paises: [BR], meses: [1, 7, 12], faixas: ["02-01..02-15"], obs_pt: "Carnaval e Réveillon quase não têm promoção", fonte: "Melhores Destinos 2020-09-27"}
  orlando_miami:   {aeroportos: [MIA, MCO, FLL, TPA], meses: [6, 7, 12], obs_pt: "furacões de jun a nov (pico meados de ago a meados de out)", fonte: "Melhores Destinos guia Orlando"}
  caribe_mexico:   {paises: [MX, DO, JM, BS, CU, PR, AW, CW, BB], meses: [12, 1, 2, 3, 4], obs_pt: "jun-nov é mais barato (ago-set 20-40% menos), com risco de furacão", fonte: "Going 2026-05-15"}
  europa:          {paises: [PT, ES, FR, IT, DE, GB, NL, BE, CH, AT, GR, IE, CZ, PL, DK, SE, NO, FI, HR, HU], meses: [6, 7, 8], obs_pt: "fim de ago/set ~33% mais barato que fim de junho", fonte: "Hopper 2025-05-28"}
  bariloche:       {aeroportos: [BRC], meses: [7, 8], fonte: "Melhores Destinos guia Bariloche"}
  patagonia:       {aeroportos: [USH, FTE], meses: [12, 1, 2], fonte: "Grupo Dicas 2026"}
  japao:           {paises: [JP], faixas: ["03-20..04-15", "04-27..05-06"], obs_pt: "cerejeiras e Golden Week", fonte: "Going"}
