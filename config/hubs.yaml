# Gateway airports per country, used to look for cheaper separate tickets
# (e.g. BSB→GRU on one ticket + GRU→MIA on another, instead of BSB→MIA).
# The search checks which of these have flights to the destination and how much it costs to reach them.
# Countries not listed: the agent passes hubs explicitly (`run novo --hubs ...`).

