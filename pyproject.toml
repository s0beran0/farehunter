[project]
name = "farehunter"
version = "0.1.0"
description = "Fare and miles finder for Claude Code (deterministic cost engine, multi-language reports)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "flights==0.9.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
farehunter = "passagens.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/passagens",
    "src/calculo",
    "src/normalizacao",
    "src/fontes",
    "src/mcp_seats",
    "src/infra",
    "src/i18n",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
